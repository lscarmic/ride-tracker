<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lee's Ride</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
html,body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1d2733}
body{display:flex;flex-direction:column;min-height:100vh}
header{display:flex;align-items:baseline;gap:14px;padding:14px 20px 12px;color:#fff}
header h1{font-size:20px;margin:0;letter-spacing:.3px}
header .tag{font-size:12px;color:#9fb0c3}
header a{margin-left:auto;font-size:13px;color:#7fd0ff;text-decoration:none;border:1px solid #3a4a5e;padding:5px 12px;border-radius:999px;white-space:nowrap}
header a:hover{background:#2a3948}
#wrap{position:relative;height:72vh;margin:0 14px;border-radius:14px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.45);border:1px solid #3a4a5e}
#map{position:absolute;inset:0}
.day{background:#7fd0ff;color:#0d2233;font-weight:700;border-radius:4px;padding:1px 5px;margin-right:7px;font-size:11px}
#gallery{margin:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
#gallery figure{margin:0;position:relative;border-radius:10px;overflow:hidden;border:1px solid #3a4a5e;cursor:pointer;aspect-ratio:4/3;background:#2a3948}
#gallery img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
#gallery figure:hover img{transform:scale(1.04)}
#gallery figcaption{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:12px}
#lightbox{position:fixed;inset:0;background:rgba(10,15,20,.93);display:none;align-items:center;justify-content:center;z-index:2000;flex-direction:column;gap:10px}
#lightbox img{max-width:88vw;max-height:78vh;border-radius:8px}
#lightbox .cap{color:#dce6f0;font-size:14px}
#lightbox .desc{color:#b8c4d0;font-size:13px;max-width:80vw;text-align:center;line-height:1.4}
#lightbox .nav{position:absolute;top:50%;transform:translateY(-50%);font-size:44px;color:#fff;cursor:pointer;padding:20px;user-select:none;opacity:.7}
#lightbox .nav:hover{opacity:1}
#lbPrev{left:6px}#lbNext{right:6px}
.photopin{font-size:18px;text-shadow:0 1px 4px rgba(0,0,0,.8);cursor:pointer}
#panel{position:absolute;top:12px;right:12px;z-index:1000;background:rgba(255,255,255,.95);border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.25);padding:14px 16px;min-width:230px;max-width:300px;max-height:calc(100% - 48px);overflow:auto}
#panel h1{font-size:16px;margin:0 0 2px}
#panel .sub{font-size:11px;color:#666;margin-bottom:10px}
.leg{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:8px;cursor:pointer;user-select:none}
.leg:hover{background:#f0f0f0}
.leg .swatch{width:14px;height:14px;border-radius:4px;flex:none}
.leg .nm{font-size:13px;font-weight:600}
.leg .ds{font-size:11px;color:#777}
.leg .mi{margin-left:auto;font-size:12px;color:#444;font-variant-numeric:tabular-nums;padding-left:10px}
.leg.off{opacity:.35}
#total{border-top:1px solid #ddd;margin-top:8px;padding-top:8px;font-size:13px;display:flex;justify-content:space-between}
#updated{font-size:10px;color:#999;margin-top:6px;text-align:right}
@media (max-width:600px){#panel{left:12px;right:12px;max-width:none;top:auto;bottom:12px;max-height:45%}}
</style></head><body>
<header>
  <h1 id="pageTitle"></h1><span class="tag" id="pageTag"></span>
  <a id="inreach" target="_blank" rel="noopener">&#128225; Live location</a>
</header>
<div id="wrap">
<div id="map"></div>
<div id="panel">
<div class="sub">Tap a leg to show/hide · click a line for details</div>
<div id="legs"></div>
<div id="total"><span>Ridden</span><strong id="totmi"></strong></div>
<div id="updated"></div>
</div>
</div>
<div id="gallery"></div>
<div id="lightbox"><span class="nav" id="lbPrev">&#8249;</span><img><span class="nav" id="lbNext">&#8250;</span><div class="cap"></div><div class="desc"></div></div>
<script>
// ===== edit these =====
const CONFIG={
  title:"Lee's Ride",
  subtitle:"July 2026",
  inreachUrl:"https://live.garmin.com/leecarmichael"
};
// ======================
document.getElementById('pageTitle').textContent=CONFIG.title;
document.getElementById('pageTag').textContent=CONFIG.subtitle;
document.title=CONFIG.title;
const ir=document.getElementById('inreach');
if(CONFIG.inreachUrl && !CONFIG.inreachUrl.includes('YOURNAME')) ir.href=CONFIG.inreachUrl; else ir.style.display='none';
const map=L.map('map');
const streets=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:19});
const satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics',maxZoom:19});
(localStorage.getItem('baselayer')==='Satellite'?satellite:streets).addTo(map);
L.control.layers({'Map':streets,'Satellite':satellite},null,{position:'bottomleft'}).addTo(map);
map.on('baselayerchange',e=>localStorage.setItem('baselayer',e.name));
const group=L.featureGroup().addTo(map);
fetch('data.json?t='+Date.now()).then(r=>r.json()).then(D=>{
  const legDiv=document.getElementById('legs');
  // planned routes: gray dashed underlay with a single toggle
  const planned=(D.planned||[]).map(p=>{
    const l=L.polyline(p.pts,{color:'#8a8f98',weight:3,opacity:.7,dashArray:'6 6'});
    l.bindPopup(`<b>${p.name}</b> (planned)<br>${p.miles.toLocaleString()} miles`);
    l.addTo(group);
    return l;
  });
  if(planned.length){
    const row=document.createElement('div');
    row.className='leg';
    row.innerHTML=`<div class="swatch" style="background:repeating-linear-gradient(90deg,#8a8f98 0 4px,transparent 4px 8px)"></div><div class="nm" style="color:#666">Planned route</div><div class="mi">${D.planned.reduce((s,l)=>s+l.miles,0).toLocaleString(undefined,{maximumFractionDigits:0})} mi</div>`;
    let on=true;
    row.onclick=()=>{on=!on;row.classList.toggle('off',!on);planned.forEach(x=>on?x.addTo(group):group.removeLayer(x));};
    legDiv.appendChild(row);
  }
  D.legs.forEach(leg=>{
    const line=L.polyline(leg.pts,{color:leg.color,weight:4,opacity:.9});
    const st=leg.stats||{};
    const bits=[leg.miles.toLocaleString()+' mi'];
    if(st.moving) bits.push(st.moving+' moving');
    if(st.avg) bits.push(st.avg+' mph avg');
    if(st.elev) bits.push(st.elev.toLocaleString()+' ft \u2191');
    line.bindPopup(`<b>${leg.name}</b>${st.date?' · '+st.date:''}<br>${bits.join(' · ')}`);
    line.addTo(group);
    line.bringToFront();
    const mk=p=>L.circleMarker(p,{radius:5,color:'#fff',weight:2,fillColor:leg.color,fillOpacity:1});
    const m1=mk(leg.pts[0]).addTo(group), m2=mk(leg.pts[leg.pts.length-1]).addTo(group);
    const row=document.createElement('div');
    row.className='leg';
    const sub=[st.moving&&st.moving+' moving',st.avg&&st.avg+' mph',st.elev&&st.elev.toLocaleString()+' ft \u2191'].filter(Boolean).join(' · ');
    row.innerHTML=`<div class="swatch" style="background:${leg.color}"></div><div><div class="nm">${leg.name}</div>${sub?`<div class="ds">${sub}</div>`:''}</div><div class="mi">${leg.miles.toLocaleString()} mi</div>`;
    let on=true;
    row.onclick=()=>{on=!on;row.classList.toggle('off',!on);[line,m1,m2].forEach(x=>on?x.addTo(group):group.removeLayer(x));};
    legDiv.appendChild(row);
  });
  document.getElementById('totmi').textContent=D.legs.reduce((s,l)=>s+l.miles,0).toLocaleString(undefined,{maximumFractionDigits:0})+' mi';
  document.getElementById('updated').textContent='Updated '+D.updated;
  if(group.getLayers().length) map.fitBounds(group.getBounds().pad(0.06));
  const gal=document.getElementById('gallery'), lb=document.getElementById('lightbox');
  const dayColor={};
  D.legs.forEach(l=>{const m=l.name.match(/^Day (\d+):/); if(m) dayColor[m[1]]=l.color;});
  const badge=d=>{
    const c=dayColor[d];
    if(!c) return `<span class="day">Day ${d}</span>`;
    const r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);
    const tx=(0.299*r+0.587*g+0.114*b)>150?'#0d2233':'#fff';
    return `<span class="day" style="background:${c};color:${tx}">Day ${d}</span>`;
  };
  const PH=D.photos||[];
  const pinLayer=L.layerGroup();
  let cur=-1;
  function show(i){
    if(!PH.length) return;
    cur=(i+PH.length)%PH.length;
    const ph=PH[cur];
    lb.querySelector('img').src=encodeURI(ph.file);
    lb.querySelector('.cap').innerHTML=(ph.day?badge(ph.day):'')+(ph.caption||'');
    lb.querySelector('.desc').textContent=ph.desc||'';
    lb.style.display='flex';
  }
  lb.onclick=e=>{if(e.target===lb||e.target.tagName==='IMG')lb.style.display='none';};
  document.getElementById('lbPrev').onclick=e=>{e.stopPropagation();show(cur-1);};
  document.getElementById('lbNext').onclick=e=>{e.stopPropagation();show(cur+1);};
  document.addEventListener('keydown',e=>{
    if(lb.style.display!=='flex')return;
    if(e.key==='ArrowLeft')show(cur-1);
    else if(e.key==='ArrowRight')show(cur+1);
    else if(e.key==='Escape')lb.style.display='none';
  });
  let tx0=null;
  lb.addEventListener('touchstart',e=>{tx0=e.touches[0].clientX;},{passive:true});
  lb.addEventListener('touchend',e=>{
    if(tx0===null)return;
    const dx=e.changedTouches[0].clientX-tx0; tx0=null;
    if(Math.abs(dx)>50) show(cur+(dx<0?1:-1));
  },{passive:true});
  PH.forEach((ph,i)=>{
    const fig=document.createElement('figure');
    const cap=(ph.day?badge(ph.day):'')+(ph.caption||'');
    fig.innerHTML=`<img src="${encodeURI(ph.file)}" loading="lazy" alt=""><figcaption>${cap}</figcaption>`;
    fig.onclick=()=>show(i);
    gal.appendChild(fig);
    if(ph.lat){
      L.marker([ph.lat,ph.lon],{icon:L.divIcon({className:'photopin',html:'&#128247;',iconSize:[24,24],iconAnchor:[12,12]})})
        .addTo(pinLayer).on('click',()=>show(i));
    }
  });
  const PIN_MIN_ZOOM=6;
  function updatePins(){
    if(map.getZoom()>=PIN_MIN_ZOOM) pinLayer.addTo(map);
    else map.removeLayer(pinLayer);
  }
  map.on('zoomend',updatePins);
  updatePins();
});
</script></body></html>
